# Netlify hosts the static frontend and proxies the API to the Python backend.
#
# Netlify Functions run JavaScript, TypeScript and Go — not Python — so the
# FastAPI app in backend/ cannot run here. It is deployed separately (see
# render.yaml / Dockerfile) and Netlify forwards /api, /login and /app to it.
#
# The proxy keeps everything on one origin, so the session cookie stays
# first-party and no CORS configuration is needed.
#
# Set API_ORIGIN in Site settings > Environment variables to the backend URL.
# The redirect rules are generated from it at build time.

[build]
  publish = "frontend"
  command = "sh scripts/build-redirects.sh"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
